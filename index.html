<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name — Portfolio</title>
<meta name="description" content="Digital Product Design · UI/UX · Interaction Art · AI Creative · 3D / Digital Twin">

<!-- ============================================================
  个人作品集 · 单文件应用（无构建、无框架、无付费依赖）
  结构索引：
    1. <style>  设计系统 + 全部样式
    2. <main>   页面容器（内容由 JS 渲染）
    3. <script> 按顺序：
       ① CONFIG   站点与个人基础信息（改这里）
       ② PROJECTS 六个项目的内容与图片路径（改这里）
       ③ EXPERIMENTS 创意实验内容
       ④ I18N     界面文案 zh / en
       ⑤ 渲染器   各页面模板函数
       ⑥ 路由     hash 路由 (#/ #/work/:id #/about #/experiments #/contact)
       ⑦ 交互     语言切换 / 滚动淡入 / 移动菜单 / 生成艺术画布
  图片说明：封面与详情图均指向 images/ 目录，
  文件缺失时自动显示灰色占位块，不会伪造任何真实成果。
============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============ 1. 设计系统 ============ */
:root{
  --bg:#ffffff;
  --ink:#111111;          /* 主文字 */
  --ink-60:#6f6f6f;       /* 次级文字 */
  --ink-40:#a8a8a8;
  --line:#e6e6e6;         /* 辅助线 */
  --panel:#f5f5f4;        /* 占位/浅底 */
  --gutter:clamp(20px,4vw,64px);
  --maxw:1440px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --font-en:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-cn:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-en),var(--font-cn);
  font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:#111;color:#fff}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;background:none;border:0;cursor:pointer;color:inherit}

/* 中文语境下的排版微调 */
html[lang="zh-CN"] body{font-family:var(--font-cn),var(--font-en);letter-spacing:.01em}

/* 通用工具类 */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.08em}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-60);font-weight:500}
.sec{border-top:1px solid var(--line);padding:clamp(64px,9vw,128px) 0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:clamp(36px,5vw,72px)}
.sec-head h2{font-size:clamp(22px,2.6vw,34px);font-weight:600;letter-spacing:-.01em}
.sec-head .count{color:var(--ink-40)}
.grid{display:grid;gap:clamp(24px,3vw,56px)}

/* 悬停下划线动画（细腻反馈） */
.u-link{position:relative;display:inline-block}
.u-link::after{
  content:"";position:absolute;left:0;bottom:-2px;width:100%;height:1px;
  background:currentColor;transform:scaleX(0);transform-origin:right;
  transition:transform .45s var(--ease);
}
.u-link:hover::after{transform:scaleX(1);transform-origin:left}

/* 滚动淡入 */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}

/* ============ 2. 导航 ============ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.nav-inner{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter);
  height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:600;font-size:15px;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px}
.logo em{font-style:normal;color:var(--ink-40);font-weight:400;font-size:12px;letter-spacing:.14em}
.nav-menu{display:flex;gap:clamp(20px,2.4vw,40px);align-items:center}
.nav-menu a{font-size:13px;letter-spacing:.06em;color:var(--ink-60);transition:color .3s}
.nav-menu a:hover,.nav-menu a.active{color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:20px}
.lang-btn{
  font-size:12px;letter-spacing:.1em;border:1px solid var(--line);
  padding:6px 14px;border-radius:999px;color:var(--ink-60);
  transition:border-color .3s,color .3s;
}
.lang-btn:hover{border-color:var(--ink);color:var(--ink)}
.burger{display:none;width:28px;height:16px;position:relative}
.burger span{position:absolute;left:0;right:0;height:1px;background:var(--ink);transition:transform .35s var(--ease),top .35s var(--ease)}
.burger span:nth-child(1){top:0}.burger span:nth-child(2){top:8px}.burger span:nth-child(3){top:16px}
.burger.open span:nth-child(1){top:8px;transform:rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){top:8px;transform:rotate(-45deg)}
.mobile-menu{
  display:none;position:fixed;top:64px;left:0;right:0;z-index:99;
  background:#fff;border-bottom:1px solid var(--line);
  padding:12px var(--gutter) 28px;
}
.mobile-menu a{display:block;padding:14px 0;font-size:16px;border-bottom:1px solid var(--line)}
.mobile-menu a:last-child{border-bottom:0}
.mobile-menu.show{display:block;animation:drop .35s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ============ 3. 首页 Hero ============ */
.hero{padding:clamp(140px,20vh,220px) 0 clamp(64px,9vw,110px)}
.hero h1{
  font-size:clamp(40px,7.6vw,110px);line-height:1.04;letter-spacing:-.03em;font-weight:600;
  max-width:14ch;
}
.hero h1 .thin{font-weight:400;color:var(--ink-40)}
.hero-sub{
  margin-top:clamp(28px,4vw,48px);display:flex;flex-wrap:wrap;gap:clamp(24px,5vw,96px);align-items:flex-start;
}
.hero-sub .zh{font-size:clamp(16px,1.5vw,20px);color:var(--ink-60);max-width:34em}
.hero-meta{display:flex;flex-direction:column;gap:10px;min-width:180px}
.hero-meta span{font-size:13px;color:var(--ink-60);letter-spacing:.04em}
.hero-rule{margin-top:clamp(48px,7vw,96px);border-top:1px solid var(--line);padding-top:20px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hero-rule span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-40)}

/* ============ 4. 作品网格 ============ */
.works-grid{grid-template-columns:1fr 1fr}
.card{display:block;position:relative}
.card .frame{
  aspect-ratio:4/3;overflow:hidden;background:var(--panel);position:relative;
  border:1px solid transparent;transition:border-color .4s var(--ease);
}
.card:hover .frame{border-color:var(--ink)}
.card .frame img{width:100%;height:100%;object-fit:cover;
  transition:transform 1s var(--ease),opacity .6s ease;transform:scale(1.001)}
.card:hover .frame img{transform:scale(1.04)}
/* 图片缺失时的占位（不伪造真实视觉） */
.card .ph,.ph-big{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:20px;color:var(--ink-40);font-size:12px;letter-spacing:.12em;
}
.card .frame.noimg img{display:none}
.card .ph{display:none}
.card .frame.noimg .ph{display:flex}
.card-info{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding-top:18px;border-top:1px solid var(--line);margin-top:16px}
.card-info h3{font-size:clamp(17px,1.6vw,21px);font-weight:600;letter-spacing:-.01em}
.card-info .tags{color:var(--ink-40);font-size:12px;letter-spacing:.08em;text-align:right;white-space:nowrap}
.card-idx{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.14em;color:#fff;mix-blend-mode:difference}

/* ============ 5. 项目详情页 ============ */
.detail-hero{padding:clamp(110px,16vh,170px) 0 clamp(40px,6vw,72px)}
.detail-hero h1{font-size:clamp(32px,5.4vw,72px);letter-spacing:-.025em;line-height:1.08;font-weight:600;max-width:16ch}
.detail-hero .lead{margin-top:24px;font-size:clamp(16px,1.6vw,20px);color:var(--ink-60);max-width:44em}
.detail-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:24px 0;margin:clamp(40px,6vw,72px) 0}
.detail-meta dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-40);margin-bottom:8px}
.detail-meta dd{font-size:14px}
.detail-body .block{margin-bottom:clamp(56px,8vw,110px)}
.detail-body h2{
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
  color:var(--ink-60);margin-bottom:22px;display:flex;align-items:center;gap:14px;
}
.detail-body h2::after{content:"";flex:1;height:1px;background:var(--line)}
.detail-body p{max-width:60em;font-size:clamp(15px,1.35vw,17px);color:#333;margin-bottom:1em}
.detail-body ul{list-style:none;max-width:60em}
.detail-body ul li{padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;
  display:flex;gap:16px;color:#333}
.detail-body ul li .n{color:var(--ink-40);font-size:12px;padding-top:3px;min-width:24px}
.figure{aspect-ratio:16/9;background:var(--panel);position:relative;overflow:hidden}
.figure.tall{aspect-ratio:4/3}
.figure img{width:100%;height:100%;object-fit:cover}
.figure.noimg img{display:none}
.ph-big{justify-content:space-between}
.ph-big .big-idx{font-size:clamp(40px,6vw,88px);font-weight:600;letter-spacing:-.03em;line-height:1;align-self:flex-start}
.figure-caption{margin-top:12px;font-size:12px;color:var(--ink-40);letter-spacing:.06em}
.fig-row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2vw,32px)}
.next-proj{border-top:1px solid var(--line)}
.next-link{display:flex;justify-content:space-between;align-items:center;
  padding:clamp(36px,5vw,64px) 0;transition:padding-left .5s var(--ease)}
.next-link:hover{padding-left:16px}
.next-link .dir{font-size:12px;letter-spacing:.2em;color:var(--ink-40);text-transform:uppercase}
.next-link h3{font-size:clamp(22px,3vw,40px);font-weight:600;letter-spacing:-.02em;margin-top:8px}
.next-link .arrow{font-size:clamp(24px,3vw,40px);transition:transform .5s var(--ease)}
.next-link:hover .arrow{transform:translateX(10px)}

/* ============ 6. About ============ */
.about-grid{display:grid;grid-template-columns:5fr 7fr;gap:clamp(40px,6vw,110px)}
.about-grid .col-l{position:sticky;top:110px;align-self:start}
.about-grid h1{font-size:clamp(28px,3.4vw,44px);letter-spacing:-.02em;line-height:1.2;font-weight:600;margin-bottom:28px}
.about-grid .portrait{aspect-ratio:4/5;background:var(--panel);position:relative;overflow:hidden;margin-top:36px}
.about-grid .portrait img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.02)}
.about-grid .portrait.noimg img{display:none}
.about-grid p{color:#333;margin-bottom:1.2em;max-width:58em}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0;margin-top:14px}
.skills div{border-top:1px solid var(--line);padding:18px 0}
.skills dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-40);margin-bottom:10px}
.skills dd{font-size:14px;color:#333}

/* ============ 7. Experiments ============ */
.exp-list{border-top:1px solid var(--line)}
.exp-item{border-bottom:1px solid var(--line)}
.exp-item summary{
  display:grid;grid-template-columns:64px 1fr auto auto;gap:clamp(12px,3vw,40px);align-items:baseline;
  padding:clamp(22px,3vw,36px) 0;cursor:pointer;list-style:none;
  transition:padding-left .45s var(--ease);
}
.exp-item summary::-webkit-details-marker{display:none}
.exp-item summary:hover{padding-left:14px}
.exp-item summary .no{color:var(--ink-40);font-size:12px;letter-spacing:.12em}
.exp-item summary h3{font-size:clamp(18px,2.2vw,28px);font-weight:600;letter-spacing:-.015em}
.exp-item summary .yr,.exp-item summary .tag{font-size:12px;color:var(--ink-60);letter-spacing:.1em}
.exp-body{padding:0 0 clamp(28px,4vw,44px) calc(64px + clamp(12px,3vw,40px));max-width:52em;color:#333}
.exp-body p{margin-bottom:16px}
.exp-body .demo{margin-top:24px}

/* 生成艺术画布（真实可运行的小实验） */
.gen-canvas{
  width:100%;aspect-ratio:16/9;background:#fafafa;border:1px solid var(--line);
  display:block;cursor:crosshair;
}
.demo-note{margin-top:10px;font-size:12px;color:var(--ink-40);letter-spacing:.06em}

/* ============ 8. Contact ============ */
.contact-hero{padding:clamp(140px,20vh,220px) 0}
.contact-hero h1{font-size:clamp(36px,6.6vw,96px);letter-spacing:-.03em;line-height:1.06;font-weight:600}
.mail{
  display:inline-block;margin-top:clamp(32px,5vw,56px);
  font-size:clamp(20px,3vw,40px);font-weight:500;letter-spacing:-.01em;
}
.contact-links{margin-top:clamp(48px,7vw,88px);border-top:1px solid var(--line)}
.contact-links a{
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(18px,2.6vw,28px) 0;border-bottom:1px solid var(--line);
  font-size:clamp(15px,1.6vw,19px);transition:padding-left .45s var(--ease);
}
.contact-links a:hover{padding-left:16px}
.contact-links a .go{color:var(--ink-40);font-size:13px;letter-spacing:.1em}

/* ============ 9. Footer ============ */
footer{border-top:1px solid var(--line);margin-top:clamp(64px,9vw,120px)}
.foot-inner{max-width:var(--maxw);margin:0 auto;padding:32px var(--gutter);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
  font-size:12px;color:var(--ink-40);letter-spacing:.06em}

/* ============ 10. 页面切换 & 响应式 ============ */
#app{animation:pagein .6s var(--ease)}
@keyframes pagein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media (max-width:960px){
  .nav-menu{display:none}
  .burger{display:block}
  .works-grid{grid-template-columns:1fr}
  .detail-meta{grid-template-columns:1fr 1fr;row-gap:28px}
  .about-grid{grid-template-columns:1fr}
  .about-grid .col-l{position:static}
  .fig-row{grid-template-columns:1fr}
  .exp-item summary{grid-template-columns:40px 1fr auto}
  .exp-item summary .tag{display:none}
  .exp-body{padding-left:calc(40px + clamp(12px,3vw,40px))}
}
@media (max-width:560px){
  .hero h1{max-width:100%}
  .detail-meta{grid-template-columns:1fr 1fr}
  .card-info{flex-direction:column;gap:4px}
  .card-info .tags{text-align:left}
}
</style>
</head>

  {

/* 语言优先级：URL 参数 ?lang=en > 本地记忆 > 默认中文 */
let LANG = new URLSearchParams(location.search).get("lang")
        || localStorage.getItem("pf-lang") || "zh";
const t   = () => I18N[LANG];
const tt  = (obj) => obj[LANG];                 // 取双字段的当前语言
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = document.getElementById("app");

/* 图片标签：加载失败时退化为占位块（不伪造内容） */
function imgTag(src, note, idx){
  return `<img src="${esc(src)}" alt="" loading="lazy"
            onerror="this.closest('.frame,.figure,.portrait')?.classList.add('noimg')">`
       + `<div class="${note ? "ph-big" : "ph"}">`
       + (note ? `<span class="big-idx mono">${String(idx).padStart(2,"0")}</span><span>${esc(note)}</span>` : `<span class="mono">${String(idx).padStart(2,"0")}</span>`)
       + `</div>`;
}

      <span class="count">${esc(e.sub)}</span>
    </div>
    <p class="reveal" style="color:var(--ink-60);margin-bottom:36px;max-width:46em">${esc(e.note)}</p>
    <div class="exp-list reveal">
      ${EXPERIMENTS.map((x,i)=>`
      <details class="exp-item">
        <summary>
          <span class="no mono">${String(i+1).padStart(2,"0")}</span>
          <h3>${esc(tt({zh:x.zh.title,en:x.en.title}))}</h3>
          <span class="tag mono">${esc(x.tag)}</span>
          <span class="yr mono">${esc(x.year)}</span>
        </summary>
        <div class="exp-body">
          <p>${esc(tt({zh:x.zh.desc,en:x.en.desc}))}</p>
          ${x.demo ? `
          <div class="demo">
            <canvas class="gen-canvas" data-demo="${x.demo}"></canvas>
            <p class="demo-note mono">${esc(e.interact)}</p>
          </div>` : ""}
        </div>
      </details>`).join("")}
    </div>
  </section>`;
}

/* —— Contact —— */
function pageContact(){
  const c = t().contact;
  return `
  <section class="contact-hero wrap">
    <p class="eyebrow reveal">${esc(CONFIG.email)}</p>
    <h1 class="reveal">${esc(c.titleA)}<br><span class="thin" style="font-weight:400;color:var(--ink-40)">${esc(c.titleB)}</span></h1>
    <a class="mail u-link reveal" href="mailto:${esc(CONFIG.email)}">${esc(c.sayHi)} ↗</a>
    <div class="contact-links reveal">
      <a href="mailto:${esc(CONFIG.email)}"><span>Email</span><span class="go">${esc(CONFIG.email)}</span></a>
      ${CONFIG.social.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener"><span class="u-link">${esc(s.label)}</span><span class="go">↗</span></a>`).join("")}
      <a href="${esc(CONFIG.cvUrl)}" target="_blank" rel="noopener"><span class="u-link">${esc(c.cv)}</span><span class="go">PDF ↗</span></a>
      <a href="#/about"><span>${esc(c.location)}</span><span class="go">${esc(CONFIG.location[LANG])}</span></a>
    </div>
  </section>`;
}

/* ============================================================
  ⑥ 路由 — hash 驱动，支持 #/#works 锚点
============================================================ */
let io = null;

function parseHash(){
  const raw = location.hash.replace(/^#\/?/, "");   // 例: "work/ev-charging" / "about" / "#works"
  const [path, anchor] = raw.split("#");
  return { path: path || "", anchor };
}

function render(){
  const { path, anchor } = parseHash();
  window.scrollTo(0,0);

  /* 清理上一页面可能存在的生成艺术画布动画 */
  app.querySelectorAll("canvas[data-demo]").forEach(cv=>cv._cleanup && cv._cleanup());

  if(path.startsWith("work/")){
    app.innerHTML = pageDetail(path.slice(5));
    document.title = `${tt({zh:"作品",en:"Work"})} — ${tt(CONFIG.name)}`;
    setRoute("works");
  } else if(path === "about"){
    app.innerHTML = pageAbout(); setRoute("about");
  } else if(path === "experiments"){
    app.innerHTML = pageExperiments(); setRoute("experiments");
    initCanvases();
  } else if(path === "contact"){
    app.innerHTML = pageContact(); setRoute("contact");
  } else {
    app.innerHTML = pageHome(); setRoute("home");
    document.title = `${tt(CONFIG.name)} — Portfolio`;
  }

  syncChrome();          // 导航/页脚文案随语言刷新
  observeReveals();      // 重新挂载滚动淡入
  if(anchor){
    const el = document.getElementById(anchor);
    if(el) setTimeout(()=>el.scrollIntoView({behavior:"smooth"}), 60);
  }
}

function setRoute(r){
  document.querySelectorAll(".nav-menu a").forEach(a=>{
    a.classList.toggle("active", a.dataset.route === r);
  });
}

addEventListener("hashchange", render);

/* ============================================================
  ⑦ 交互逻辑
============================================================ */
/* 滚动淡入（IntersectionObserver） */
function observeReveals(){
  if(io) io.disconnect();
  io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
    });
  },{ threshold:.08, rootMargin:"0px 0px -4% 0px" });
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
}

/* 语言切换：刷新 html lang、导航、页脚与当前页面 */
function syncChrome(){
  const n = t().nav;
  document.getElementById("logo-name").textContent = tt(CONFIG.name);
  document.getElementById("logo-role").textContent  = tt(CONFIG.role).split(" / ")[0].toUpperCase();
  document.getElementById("nav-home").textContent  = n.home;
  document.querySelector('[href="#/#works"]').textContent = n.works;
  document.querySelector('[href="#/experiments"]').textContent = n.experiments;
  document.querySelector('[href="#/about"]').textContent = n.about;
  document.querySelector('[href="#/contact"]').textContent = n.contact;
  document.getElementById("foot-c").textContent = t().footer.c;
  document.getElementById("foot-l").textContent = t().footer.l;
  const mm = document.getElementById("mobile-menu");
  mm.children[0].textContent = n.home;
  mm.children[1].textContent = n.works;
  mm.children[2].textContent = n.experiments;
  mm.children[3].textContent = n.about;
  mm.children[4].textContent = n.contact;
}

document.getElementById("lang-btn").addEventListener("click", ()=>{
  LANG = LANG === "zh" ? "en" : "zh";
  localStorage.setItem("pf-lang", LANG);
  document.documentElement.lang = t().htmlLang;
  render();
});

/* 移动端菜单 */
const burger = document.getElementById("burger");
const mobileMenu = document.getElementById("mobile-menu");
burger.addEventListener("click", ()=>{
  burger.classList.toggle("open");
  mobileMenu.classList.toggle("show");
});
mobileMenu.addEventListener("click", (e)=>{
  if(e.target.tagName === "A"){ burger.classList.remove("open"); mobileMenu.classList.remove("show"); }
});

/* —— 生成艺术画布（Experiments 页，真实运行） —— */
function initCanvases(){
  document.querySelectorAll("canvas[data-demo]").forEach(cv=>{
    const kind = cv.dataset.demo;
    const ctx = cv.getContext("2d");
    let W,H,raf,pointer = {x:.5,y:.5}, t0 = 0;

    function fit(){
      const r = cv.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio||1, 2);
      W = r.width; H = r.height;
      cv.width = W*dpr; cv.height = H*dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    fit();
    const ro = new ResizeObserver(fit); ro.observe(cv);

    cv.addEventListener("pointermove", e=>{
      const r = cv.getBoundingClientRect();
      pointer.x = (e.clientX-r.left)/r.width;
      pointer.y = (e.clientY-r.top)/r.height;
    });
    cv.addEventListener("click", ()=>{ t0 = 0; });

    /* 流动线条：正弦向量场 + 粒子轨迹 */
    const flow = ()=>{
      ctx.fillStyle = "rgba(250,250,250,.08)";
      ctx.fillRect(0,0,W,H);
      const n = 90, m = t0;
      for(let i=0;i<n;i++){
        ctx.beginPath();
        let x = (i/n)*W, y = H*.5;
        for(let s=0;s<60;s++){
          const ang = Math.sin(x*.008 + m*.6 + pointer.x*6)
                    + Math.cos(y*.008 - m*.4 + pointer.y*4);
          x += Math.cos(ang*Math.PI)*2.2;
          y += Math.sin(ang*Math.PI)*2.2;
          if(s===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        const a = .06 + .1*((i%7)/7);
        ctx.strokeStyle = `rgba(17,17,17,${a})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      t0 += .012;
    };

    /* 噪声网格：单元格随时间与指针呼吸 */
    const grid = ()=>{
      ctx.clearRect(0,0,W,H);
      const cols = 46, rows = Math.round(cols*H/W);
      const cw = W/cols, ch = H/rows;
      for(let i=0;i<cols;i++){
        for(let j=0;j<rows;j++){
          const v = Math.sin(i*.35 + t0) * Math.cos(j*.35 - t0*.7);
          const d = Math.hypot(i/cols - pointer.x, j/rows - pointer.y);
          const amp = Math.max(0, 1 - d*2.2);
          const s = (v*.5+.5)*.55 + amp*.45;
          const sz = Math.min(cw,ch)*.62*s;
          ctx.fillStyle = s > .82 ? "#111" : (s > .55 ? "#555" : "#c9c9c9");
          ctx.fillRect(i*cw + (cw-sz)/2, j*ch + (ch-sz)/2, sz, sz);
        }
      }
      t0 += .02;
    };

    (function loop(){ (kind==="flow"?flow:grid)(); raf = requestAnimationFrame(loop); })();
    cv._cleanup = ()=>{ cancelAnimationFrame(raf); ro.disconnect(); };
  });
}

/* 初始化 */
document.documentElement.lang = t().htmlLang;
render();
</script>
